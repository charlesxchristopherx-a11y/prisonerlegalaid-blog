name: IndexNow submit

# Tells Bing (and Copilot / ChatGPT search, which read Bing's index), Yandex, Seznam and Naver
# that specific URLs were added or changed. Google does not use IndexNow; it uses the sitemap.
#
# Hands Brief 33 (2026-10-05) rebuilt this file, byte-identical in BOTH repos (the host is
# read from the repo name). What changed and why:
#  - CHANGE DETECTION: it used to diff HEAD~1..HEAD, so it saw only the newest commit, missed
#    anything earlier in the day, and re-submitted the same URLs every day when nothing new had
#    been pushed (the same commit was submitted on 3 consecutive days in Sept/Oct). It now diffs
#    from the commit of the last SUCCESSFUL run of this workflow, so every changed URL is sent
#    exactly once and an unchanged site sends nothing.
#  - TRIGGERS: on push to main (immediate), plus a daily run 30 min after daily-publish, because
#    pushes made with GITHUB_TOKEN by daily-publish do not trigger push workflows.
#  - DEPLOY WAIT: Cloudflare deploys after the push. Each URL must return 200 live before it is
#    submitted; a URL that never comes up fails the run, so the next run retries it.
#  - STATIC PAGES: src/<page>.njk is mapped through its `permalink:` front matter.
#  - A 200/202 from IndexNow means ACCEPTED, not indexed. Indexing shows later in Bing
#    Webmaster Tools.
on:
  push:
    branches: [main]
    paths: ["src/**"]
  schedule:
    - cron: "50 9 * * *"      # 09:50 UTC, 30 min after daily-publish (09:20)
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional comma-separated URLs to submit instead of auto-detection"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY: bc10900418a84a23a3fb1da926b6ed98
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host for this repo
        run: |
          case "${GITHUB_REPOSITORY##*/}" in
            prisonerlegalaid-com)  echo "HOST=prisonerlegalaid.com"  >> "$GITHUB_ENV" ;;
            prisonerlegalaid-blog) echo "HOST=prisonerlegalaid.blog" >> "$GITHUB_ENV" ;;
            *) echo "::error::Unknown repo ${GITHUB_REPOSITORY}"; exit 1 ;;
          esac

      - name: Verify the key file is actually served
        run: |
          # Retries for up to 5 minutes: on a push, Cloudflare may still be deploying.
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/key.txt -w "%{http_code}" "https://${HOST}/${KEY}.txt?r=$i")
            [ "$CODE" = "200" ] && break; sleep 20
          done
          if [ "$CODE" != "200" ]; then echo "::error::Key file not reachable on ${HOST} (HTTP $CODE)."; exit 1; fi
          if [ "$(tr -d '[:space:]' < /tmp/key.txt)" != "$KEY" ]; then echo "::error::Key file content does not match."; exit 1; fi
          echo "key file verified on ${HOST}"

      - name: Determine changed URLs since the last successful run
        id: urls
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ inputs.urls }}
        run: |
          python3 - <<'PY'
          import subprocess, os, re, json, urllib.request
          host = os.environ["HOST"]; manual = (os.environ.get("MANUAL") or "").strip()
          def git(*a): return subprocess.run(["git", *a], capture_output=True, text=True).stdout
          urls, base = [], ""
          if manual:
              urls = [u.strip() for u in manual.split(",") if u.strip()]
          else:
              api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/indexnow.yml/runs?status=success&branch=main&per_page=20"
              req = urllib.request.Request(api, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              runs = json.load(urllib.request.urlopen(req, timeout=30)).get("workflow_runs", [])
              for r in runs:
                  if git("cat-file", "-t", r["head_sha"]).strip() == "commit" and \
                     subprocess.run(["git", "merge-base", "--is-ancestor", r["head_sha"], "HEAD"]).returncode == 0:
                      base = r["head_sha"]; break
              if not base:
                  base = git("rev-parse", "HEAD~1").strip()   # first run: newest commit only
              print("diff base:", base)
              for line in git("diff", "--name-status", "--diff-filter=AMR", base, "HEAD").splitlines():
                  f = line.split("\t")[-1]
                  if f.startswith("src/posts/") and f.endswith(".md"):
                      txt = open(f, encoding="utf8").read()
                      if re.search(r"^draft:\s*true\s*$", txt, re.M): continue
                      m = re.search(r"^permalink:\s*[\"']?([^\"'\n]+)", txt, re.M)
                      path = m.group(1).strip() if m else "/blog/" + os.path.basename(f)[:-3] + "/"
                      urls.append(f"https://{host}{path}")
                  elif re.fullmatch(r"src/[a-z0-9-]+\.njk", f):
                      m = re.search(r"^permalink:\s*[\"']?([^\"'\n]+)", open(f, encoding="utf8").read(), re.M)
                      if m and m.group(1).strip().endswith("/"):
                          urls.append(f"https://{host}{m.group(1).strip()}")
          urls = sorted(set(u for u in urls if u.startswith(f"https://{host}/")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("list=" + json.dumps(urls) + "\n"); fh.write(f"count={len(urls)}\n")
          print(f"{len(urls)} url(s) to submit"); [print("  ", u) for u in urls]
          PY

      - name: Wait until every URL is in the live sitemap (Cloudflare deploy)
        if: steps.urls.outputs.count != '0'
        env:
          URLS: ${{ steps.urls.outputs.list }}
        run: |
          # The live sitemap is the deploy signal. Fetching the HTML pages themselves from a
          # GitHub runner hung (2026-10-05 run 37313546170): Cloudflare challenges datacenter IPs
          # on HTML, while .txt/.xml come back 200. A URL is submitted only once the deployed
          # sitemap lists it; if it never appears the run fails and the next run retries it.
          python3 - <<'PY'
          import json, os, time, subprocess
          host = os.environ["HOST"]; pending = set(json.loads(os.environ["URLS"]))
          for attempt in range(30):                      # up to ~10 minutes
              xml = subprocess.run(["curl", "-s", "--max-time", "20", f"https://{host}/sitemap.xml?a={attempt}"],
                                   capture_output=True, text=True).stdout
              pending = {u for u in pending if f"<loc>{u}</loc>" not in xml}
              if not pending: print("all URLs present in the live sitemap"); break
              time.sleep(20)
          if pending: raise SystemExit("::error::Not in the live sitemap after 10 minutes: " + ", ".join(sorted(pending)))
          PY

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        env:
          URLS: ${{ steps.urls.outputs.list }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host, key = os.environ["HOST"], os.environ["KEY"]
          body = {"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": json.loads(os.environ["URLS"])}
          print("REQUEST BODY:", json.dumps(body))
          req = urllib.request.Request("https://api.indexnow.org/IndexNow", data=json.dumps(body).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r: code, txt = r.status, r.read()[:300].decode(errors="replace")
          except urllib.error.HTTPError as e: code, txt = e.code, e.read()[:300].decode(errors="replace")
          print("IndexNow HTTP", code, txt)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s: s.write(f"IndexNow HTTP {code} (accepted, NOT indexed) for {len(body['urlList'])} URL(s)\n")
          if code not in (200, 202): raise SystemExit(1)
          PY

      - name: Summary
        if: always()
        run: |
          echo "URLs detected: ${{ steps.urls.outputs.count }}" >> $GITHUB_STEP_SUMMARY

name: Weekly video render

# Runs after the Monday article publish so there is fresh content to draw from.
# Renders one short-form video from the newest post that has a verified answer
# block, commits it, and records the slug so it is never rendered twice.
on:
  schedule:
    - cron: "40 14 * * 1"     # Mon 14:40 UTC (~10:40am ET)
  workflow_dispatch: {}

concurrency:
  group: video-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check project claim before rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("PROJECT_STATE.md").read_text()
          match = re.search(r"## Claimed by another session\n(.*?)(?=\n## |\n---|\Z)", text, re.S)
          if not match:
              raise SystemExit("PROJECT_STATE.md is missing the claimed-section marker")
          lines = [line.strip() for line in match.group(1).splitlines() if line.strip()]
          active_claims = [line for line in lines if not line.startswith("- (none active")]
          if active_claims:
              print("Active PROJECT_STATE claim found:")
              print("\n".join(active_claims))
              raise SystemExit(1)
          print("No active PROJECT_STATE claim; continuing.")
          PY

      - name: Install fonts and ffmpeg
        run: |
          # Do not assume the runner image ships these. It once had ffmpeg but
          # not ffprobe, which failed the first live run. Do not rely on apt
          # either: on Nov 23 2026 the Ubuntu mirror took the whole 20-minute
          # job budget just downloading ffmpeg. Use what is on the image if
          # both binaries are there; otherwise pull a static build from GitHub.
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg and ffprobe already on the runner"
          else
            # Prefer a stable release-branch build; master is last because the
            # master build dropped -filter_complex_script on Nov 23 2026 and broke
            # the render. render.py now handles both flag spellings either way.
            # A missing asset name 404s instantly (-f) and the next one is tried.
            base="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
            got=""
            for f in ffmpeg-n8.0-latest-linux64-gpl-8.0.tar.xz \
                     ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz \
                     ffmpeg-master-latest-linux64-gpl.tar.xz; do
              if curl -sfL --retry 3 --max-time 300 -o /tmp/ffmpeg.tar.xz "$base/$f"; then
                echo "using static build $f"; got=1; break
              fi
            done
            if [ -n "$got" ]; then
              mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
              sudo install -m 755 /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
            else
              echo "static build download failed; falling back to apt"
              timeout 600 sudo apt-get update -qq
              timeout 600 sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          # fonts-google-poppins is not packaged; pull the two weights we need
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          for w in Bold Medium; do
            curl -sfL -o "/tmp/Poppins-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
            sudo cp "/tmp/Poppins-$w.ttf" /usr/share/fonts/truetype/google-fonts/
          done
          sudo fc-cache -f >/dev/null
          ffmpeg -version | head -1
          ffprobe -version | head -1
          ls -la /usr/share/fonts/truetype/google-fonts/

      - name: Caption logic tests
        working-directory: video-pipeline
        run: python3 test_render.py

      - name: Choose a post and build the script
        id: script
        run: python3 video-pipeline/make_script.py

      - name: Render
        if: steps.script.outputs.slug != ''
        working-directory: video-pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
        run: |
          mkdir -p ../video-out
          # One retry: the TTS and Whisper calls go to Cloudflare and can fail
          # transiently. A real code fault fails both attempts and is reported.
          for attempt in 1 2; do
            if python3 render.py \
                --script script.txt \
                --out "../video-out/${{ steps.script.outputs.slug }}.mp4" \
                --voice helena; then
              exit 0
            fi
            echo "render attempt $attempt failed"
            [ "$attempt" = 1 ] && sleep 30
          done
          exit 1

      - name: Record it so it is never rendered twice
        if: success() && steps.script.outputs.slug != ''
        run: |
          python3 - <<'PY'
          import json, os
          p = "video-pipeline/rendered.json"
          d = json.load(open(p)) if os.path.exists(p) else {"rendered": []}
          slug = "${{ steps.script.outputs.slug }}"
          if slug and slug not in d["rendered"]:
              d["rendered"].append(slug)
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Commit
        if: success() && steps.script.outputs.slug != ''
        run: |
          git config user.name "PLA Video Bot"
          git config user.email "chris@prisonerlegalaid.com"
          git add video-out video-pipeline/rendered.json
          if git diff --staged --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "video: ${{ steps.script.outputs.slug }}

          Rendered automatically from the post's verified answer block.
          Voice: Aura-2 helena. Captions timed by Whisper against the
          original script text."
          git pull --rebase --autostash
          git push

      - name: Summary
        if: always()
        run: |
          echo "### Weekly video render" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Post: ${{ steps.script.outputs.slug }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Video: https://raw.githubusercontent.com/charlesxchristopherx-a11y/prisonerlegalaid-blog/main/video-out/${{ steps.script.outputs.slug }}.mp4" >> $GITHUB_STEP_SUMMARY

name: Claude Code

# Two ways to trigger:
# 1. Mention @claude in an issue or PR comment -- Claude reads context and responds/pushes.
# 2. Manual dispatch from the Actions tab (or via the GitHub API) with a task
#    description -- lets Claude apply a specific, pre-written job packet and
#    push it without anyone needing to be in a live chat session.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      task:
        description: "What Claude should do in this repo"
        required: true
        type: string

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pinned to the v1 major-version tag rather than @beta. The Jan 2026
      # bot-permission-check vulnerability (CVSS 7.8) in claude-code-action
      # was patched in v1.0.94; pinning to a stable major tag rather than a
      # moving @beta ref avoids re-introducing anything like it silently.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.task || '' }}
